services:
  # ============================================================================
  # 1. Runwise Production Agent Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: runwise-agent:latest
    container_name: runwise-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/creds/adc.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/creds/adc.json:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - runwise-net

  # ============================================================================
  # 2. Prometheus Metrics Scraper & Alert Engine
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: runwise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - runwise-net

  # ============================================================================
  # 3. Grafana Observability Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: runwise-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false

    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - runwise-net

# ==============================================================================
# Isolated Internal Bridge Network
# ==============================================================================
networks:
  runwise-net:
    driver: bridge
