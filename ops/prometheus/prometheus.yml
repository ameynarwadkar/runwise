global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  # 1. Scrape Runwise FastAPI Agent Service
  - job_name: "runwise-service"
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "runwise-agent"
          env: "production"

  # 2. Scrape Prometheus internal metrics
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
