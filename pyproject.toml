[project]
name = "runwise"
version = "0.1.0"
description = "Production Agent Evaluation Harness & Observability System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix>=4.0.0",
    "fastapi>=0.143.1",
    "litellm>=1.40.0",
    "numpy>=1.26.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "scipy>=1.13.0",
    "transformers>=5.20.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.7",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

